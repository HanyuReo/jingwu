<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1018">
<title>鲸屋</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand">
      <span class="logo">鲸屋</span>
      <span id="presence" class="presence"></span>
    </div>
    <ul id="convList" class="conv-list"></ul>
    <div class="side-foot">自己的聊天窗口</div>
  </aside>

  <main id="main">
    <header id="topbar">
      <button id="backBtn" class="icon" aria-label="返回">←</button>
      <div>
        <div id="chatTitle">选一个对话</div>
        <div id="chatSub" class="sub"></div>
      </div>
    </header>

    <div id="log" class="log"></div>

    <div id="mentions" class="mentions"></div>

    <form id="composer" class="composer">
      <button type="button" id="attach" class="icon" aria-label="发送图片">＋</button>
      <textarea id="input" rows="1" placeholder="说点什么…" autocomplete="off"></textarea>
      <button type="submit" id="send" class="send">发送</button>
    </form>
    <input type="file" id="file" accept="image/*" multiple hidden>
  </main>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
